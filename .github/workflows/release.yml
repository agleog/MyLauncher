name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw 'Release tags must use the vMAJOR.MINOR.PATCH format, for example v0.1.0.'
          }
          "RELEASE_VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Build and test release artifacts
        shell: pwsh
        run: >-
          .\gradlew.bat --no-daemon clean test packageLauncherChecksum
          :installer:test packageSetupExe
          '-PreleaseVersion=${{ env.RELEASE_VERSION }}'
          '-PgithubRepository=${{ github.repository }}'

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          build/distributions/MyLauncher-windows-x64.zip
          build/distributions/MyLauncher-windows-x64.zip.sha256
          build/distributions/MyLauncherSetup.exe
          --title "MyLauncher $env:GITHUB_REF_NAME"
          --generate-notes
